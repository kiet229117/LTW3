<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client - Tác Nghiệp Thủ Kho</title>
</head>
<body>
    <h1>Trang Tác Nghiệp Thủ Kho (Client)</h1>
    <section>
        <h2>1. Phiếu Nhập Kho GRN (Receiving Service - 8084)</h2>
        <button onclick="loadReceipts()">Tải danh sách phiếu nhập kho</button>
        <pre id="receiptResult">Chưa tải dữ liệu...</pre>
    </section>

    <section>
        <h2>2. Thông báo hệ thống kho (Notification Service - 8085)</h2>
        <button onclick="loadNotifications()">Xem thông báo chưa đọc</button>
        <pre id="notifResult">Chưa tải dữ liệu...</pre>
    </section>

    <script>
        async function loadReceipts() {
            const res = await fetch("http://localhost:8084/api/receipts");
            document.getElementById("receiptResult").textContent = JSON.stringify(await res.json(), null, 2);
        }
        async function loadNotifications() {
            const res = await fetch("http://localhost:8085/api/notifications/unread");
            document.getElementById("notifResult").textContent = JSON.stringify(await res.json(), null, 2);
        }
    </script>
</body>
</html>
