<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Quản Trị Kho Nhập Hàng</title>
</head>
<body>
    <h1>Trang Quản Trị Kho (Admin)</h1>
    <section>
        <h2>1. Danh sách Sản phẩm (Product Service - 8081)</h2>
        <button onclick="loadProducts()">Tải danh sách sản phẩm</button>
        <pre id="productResult">Chưa tải dữ liệu...</pre>
    </section>

    <section>
        <h2>2. Danh sách Đơn đặt hàng PO (Order Service - 8082)</h2>
        <button onclick="loadOrders()">Tải danh sách đơn hàng</button>
        <pre id="orderResult">Chưa tải dữ liệu...</pre>
    </section>

    <section>
        <h2>3. Cảnh báo Tồn kho thấp (Inventory Service - 8083)</h2>
        <button onclick="loadLowStock()">Kiểm tra tồn kho thấp</button>
        <pre id="inventoryResult">Chưa tải dữ liệu...</pre>
    </section>

    <script>
        async function loadProducts() {
            const res = await fetch("http://localhost:8081/api/products");
            document.getElementById("productResult").textContent = JSON.stringify(await res.json(), null, 2);
        }
        async function loadOrders() {
            const res = await fetch("http://localhost:8082/api/orders");
            document.getElementById("orderResult").textContent = JSON.stringify(await res.json(), null, 2);
        }
        async function loadLowStock() {
            const res = await fetch("http://localhost:8083/api/inventories/low-stock");
            document.getElementById("inventoryResult").textContent = JSON.stringify(await res.json(), null, 2);
        }
    </script>
</body>
</html>
