spring.application.name=order-service
server.port=8082

# Ket noi H2 Database mien phi (luu file ben vung tai ./data/order_db)
spring.datasource.url=jdbc:h2:file:./data/order_db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Giao dien quan tri H2 Console: http://localhost:8082/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Dia chi cac Microservices
services.product.url=http://localhost:8081
services.notification.url=http://localhost:8085
services.user.url=http://localhost:8086

# CORS Configuration
app.cors.allowed-origins=http://localhost:5173
