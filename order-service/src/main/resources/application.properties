spring.application.name=order-service
server.port=8082

# Ket noi PostgreSQL (Database rieng cho Order Service: order_db)
spring.datasource.url=jdbc:postgresql://localhost:5432/order_db
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Dia chi cac Microservices
services.product.url=http://localhost:8081
services.notification.url=http://localhost:8085
services.user.url=http://localhost:8086

# CORS Configuration
app.cors.allowed-origins=http://localhost:5173
